title: Jupiter 的笔记
author: Jupiter
description: 记录 Android、Gradle 与日常开发里踩过的坑。
github: djj20115502
baseurl: ''

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# 不参与站点构建的文件（本地编辑器、旧资料等）
exclude:
  - tools
  - editor.cmd
  - README.md
  - LICENSE.txt
  - .idea
  - gradle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  # ipv6 上报脚本只在本地运行，不发布到站点
  - ipv6/report-ipv6.ps1
  - ipv6/install-task.ps1
  - ipv6/uninstall-task.ps1
  - ipv6/config.json
  - ipv6/config.example.json
  - ipv6/README.md

defaults:
  - scope:
      path: ''
      type: posts
    values:
      layout: post
